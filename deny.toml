# Supply-chain policy for aivtuber (issue #100).
# Local check:  cargo deny check
# CI: runs the same command in the `supply-chain` job (.github/workflows/ci.yml).
# Advisory exception procedure: see docs/supply-chain.adoc.

[graph]
# Check the dependency graph for all workspace targets.

[advisories]
# Known RustSec advisories are denied. A temporary exception goes here with
# reason, owner, and revisit condition — see docs/supply-chain.adoc.
version = 2
ignore = [
    # { id = "RUSTSEC-0000-0000", reason = "example: unmaintained transitive dep, no actionable fix; revisit when X" },
]

# This section is considered when running `cargo deny check licenses`.
[licenses]
version = 2
# Permissive licenses only. Copyleft (GPL/AGPL) is not allowed; LGPL-2.1 in
# r-efi and CDLA-Permissive-2.0 in webpki-roots are documented exceptions
# below until the crates drop out of the graph.
#
# NCSA arrives only via libfuzzer-sys, which is reachable solely from the
# excluded fuzz/ crate (issue #146). It is OSI-approved and required by the
# libFuzzer runtime, so there is no action to take; the entry exists so the
# fuzz lock file can pass the same license gate as the workspace lock file.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "LGPL-2.1-or-later",
    "NCSA",
]
confidence-threshold = 0.8

# Scoped exceptions for the build-time-only dependencies of the optional
# `sherpa-stt` feature (issue #92 S3b, decision Q4). They are reachable through
# `sherpa-onnx-sys`'s build script (archive extraction through `zip`); since
# #294 S2 `libbz2-rs-sys` is also linked into `aivtuber-setup` (bzip2 model
# archives). They are not global allowlist additions:
# any other crate under these licenses is still rejected. The default
# `cargo deny check` graph includes `libbz2-rs-sys` (through `aivtuber-setup`) but not `ppmd-rust` (the feature is off), so that one reports as
# unused there; `cargo deny --features sherpa-stt check` (the CI job
# for the feature) exercises them. Reason and revisit condition:
# docs/supply-chain.adoc, "sherpa-onnx (feature sherpa-stt)".
[[licenses.exceptions]]
crate = "libbz2-rs-sys@0.2.6"
allow = ["bzip2-1.0.6"]

# `CC0-1.0 OR MIT-0`: the OR is satisfied by MIT-0 alone, so CC0-1.0 stays out.
[[licenses.exceptions]]
crate = "ppmd-rust@1.5.2"
allow = ["MIT-0"]

[licenses.private]
# Workspace crates are internal and not published; skip their license check.
ignore = true
registries = []

[bans]
# Duplicate crate versions are tolerated for now but reported; revisit if the
# duplicate count grows without consolidation.
multiple-versions = "warn"
# Path dependencies between workspace members read as wildcard requirements
# (`version.workspace = true` inheritance); allow them explicitly. External
# wildcard requirements remain denied.
wildcards = "allow"
allow-wildcard-paths = true
highlight = "all"

# This section is considered when running `cargo deny check sources`.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
