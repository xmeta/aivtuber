[package]
name = "aivtuber-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "First-run setup command for the local profile (issue #294 S2): verified downloads, safe extraction, starter audio, env file."

# Reuse decision (docs/reuse-first.adoc, "Release packaging"): every dependency
# below is already in Cargo.lock for another workspace member, so this crate
# adds no new package to the supply-chain gate. See docs/supply-chain.adoc
# section 11.
[dependencies]
bzip2 = "0.6.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1"
getrandom = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
ureq = "3.4"
url = "2.5.8"
zip = { version = "9.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
aivtuber-adapters = { path = "../adapters" }
