[package]
name = "aivtuber-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Gapless phrase queue (#83 S3d) on rodio, without an output device: `rodio`
# without its `playback` feature does not pull cpal, so this builds and tests
# (the offline sample-exactness falsifier) on any host, ALSA headers or not.
gapless-queue = ["dep:rodio"]
# The default output device through rodio (`RodioAudioPlayer`, the benchmark).
# `playback` pulls cpal, which needs ALSA development headers on Linux exactly
# like `mic-capture`; opt-in, never part of a default build. Built and run on
# Windows only so far.
native-audio-spike = ["gapless-queue", "rodio/playback"]
# Silero VAD v6 inference (pure Rust, tract) and WAV input for the
# speech-vad-sidecar binary (#92 S2). Off by default so the workspace build
# does not compile an inference runtime.
silero-vad = ["dep:tract-onnx", "dep:hound"]
# Local microphone capture through cpal for the sidecar. Separate from
# silero-vad because cpal needs ALSA development headers on Linux.
mic-capture = ["dep:cpal"]
# Local Japanese speech-to-text worker (#92 S3b): the official sherpa-onnx
# crate (offline recognizer, shared libraries). Off by default. Every build
# that enables it MUST set SHERPA_ONNX_ARCHIVE_DIR to an archive verified by
# scripts/fetch-sherpa-onnx.mjs, otherwise the crate build script downloads
# unchecked binaries (docs/supply-chain.adoc).
sherpa-stt = ["dep:sherpa-onnx"]
# Local Japanese text-to-speech sidecar (#220 S2b): the same official
# sherpa-onnx crate (offline TTS, Supertonic 3 int8), so no new crate path.
# The same SHERPA_ONNX_ARCHIVE_DIR rule as sherpa-stt applies to every build.
sherpa-tts = ["dep:sherpa-onnx"]

[dependencies]
aivtuber-domain = { path = "../domain" }
base64 = "0.23.1"
# NFKC for the screen-caption producer (#90 S1b). Already in Cargo.lock through
# url -> idna; no new package, only a direct edge (docs/supply-chain.adoc).
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
getrandom = "0.4.3"
# Request-head parsing for the local TTS sidecar server (#220 S2b): already in
# Cargo.lock through tungstenite; pinned to that exact version.
httparse = "=1.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tungstenite = "0.30.0"
ureq = { version = "3.4", features = ["json"] }
url = "2.5.8"
rodio = { version = "0.22.2", default-features = false, features = ["wav"], optional = true }
rmcp = { version = "3.9.0", default-features = false, features = ["client", "server", "macros", "transport-async-rw"] }
tokio = { version = "1.53.1", features = ["sync", "time", "rt", "macros"] }
tract-onnx = { version = "0.23.10", default-features = false, optional = true }
hound = { version = "3.5", optional = true }
cpal = { version = "0.17.3", optional = true }
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["shared"], optional = true }
twitch-irc = { version = "6.1.3", default-features = false, features = ["transport-tcp-native-tls"] }
rubato = { version = "5", default-features = false }

[dev-dependencies]
aivtuber-scheduler = { path = "../scheduler" }
rig-core = { version = "0.45.0", default-features = false }
rig-rmcp = { version = "0.45.0", default-features = false }
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "io-util"] }

[[bin]]
name = "audio-backend-benchmark"
path = "src/bin/audio-backend-benchmark.rs"
required-features = ["native-audio-spike"]

[[bin]]
name = "speech-vad-sidecar"
path = "src/bin/speech-vad-sidecar.rs"
required-features = ["silero-vad"]

[[bin]]
name = "speech-stt-worker"
path = "src/bin/speech-stt-worker.rs"
required-features = ["sherpa-stt"]

[[bin]]
name = "speech-stt-worker-double"
path = "src/bin/speech-stt-worker-double.rs"

[[bin]]
name = "local-tts-sidecar"
path = "src/bin/local-tts-sidecar.rs"
required-features = ["sherpa-tts"]

[[bin]]
name = "local-tts-sidecar-double"
path = "src/bin/local-tts-sidecar-double.rs"

[[bin]]
name = "twitch-chat-ingress"
path = "src/bin/twitch-chat-ingress.rs"

[[bin]]
name = "youtube-chat-ingress"
path = "src/bin/youtube-chat-ingress.rs"
