[package]
name = "aivtuber-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aivtuber-domain = { path = "../domain" }
base64 = "0.23.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tungstenite = "0.30.0"
ureq = { version = "3.4", features = ["json"] }

[dev-dependencies]
aivtuber-scheduler = { path = "../scheduler" }
