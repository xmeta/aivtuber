[package]
name = "aivtuber-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
native-audio-spike = ["dep:rodio"]

[dependencies]
aivtuber-domain = { path = "../domain" }
base64 = "0.23.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tungstenite = "0.30.0"
ureq = { version = "3.4", features = ["json"] }
rodio = { version = "0.22.2", default-features = false, features = ["wav"], optional = true }

[target.'cfg(windows)'.dependencies]
rodio = { version = "0.22.2", default-features = false, features = ["wav", "playback"], optional = true }

[dev-dependencies]
aivtuber-scheduler = { path = "../scheduler" }

[[bin]]
name = "audio-backend-benchmark"
path = "src/bin/audio-backend-benchmark.rs"
required-features = ["native-audio-spike"]
