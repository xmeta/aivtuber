[workspace]
members = [
    "crates/domain",
    "crates/asset-store",
    "crates/scheduler",
    "crates/reflex",
    "crates/telemetry",
    "crates/runtime",
    "crates/adapters",
    "crates/generative",
    "crates/adaptation",
    "crates/hardening",
    "crates/app",
]
# The fuzz crate is intentionally NOT a member (issue #146). It needs a nightly
# compiler and `libfuzzer-sys`; as a member it would be resolved by
# `cargo test --workspace`, `cargo clippy --all-targets` and `cargo deny check`,
# putting the fuzzer toolchain into the workspace lock file and the supply-chain
# gate. Excluded, it resolves its own lock file and no production build can reach
# it. Verified by `crates/scheduler/tests/workspace_contract.rs`.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
# Internal workspace: crates are not published to crates.io (issue #100).
# Members inherit this, which also lets cargo-deny treat them as private
# (skipping their license expressions) and allow intra-workspace path deps.
publish = false
