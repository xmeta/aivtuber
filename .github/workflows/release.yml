name: Release archives

# Issue #294 S1: prebuilt local-profile archives for Windows x64 and Linux x64.
# Reuse decision (docs/reuse-first.adoc, "Release packaging"): a plain Actions
# matrix, not cargo-dist. Policy: docs/supply-chain.adoc section 11.
#
# Triggers
#   * a version tag (v*): builds, smoke-tests, and creates a DRAFT GitHub
#     release holding the archives and SHA256SUMS. A person publishes the draft.
#   * workflow_dispatch: a dry run. Same build and smoke tests; the archives and
#     SHA256SUMS are uploaded as workflow artifacts only and nothing is released.
#
# Trust boundary: this workflow never runs for pull requests, so no fork code
# reaches it. Only the `publish` job has write permission. There is no cache, so
# a release is built from the tag's sources and the SHA-256-verified engine
# archive alone. Third-party actions are pinned to a commit SHA.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the dry-run archive names (letters, digits, . _ -)"
        required: false
        default: "dry-run"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # One Cargo feature set for every bundled sidecar (docs/local-profile-quickstart.adoc step 2).
  ADAPTER_FEATURES: silero-vad,mic-capture,sherpa-stt,sherpa-tts
  # Archive names and the embedded README carry this label.
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('{0}-{1}', inputs.version || 'dry-run', github.run_number) }}

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      # Release builds only; dev and CI builds are unchanged. Empty on Linux.
      RUSTFLAGS: ${{ matrix.rustflags }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static C runtime for every Rust program: a clean Windows has no
          # Visual C++ runtime (issue #294: VCRUNTIME140.dll not found). The
          # bundled engine DLLs are the "MT" build and import none either; the
          # smoke job checks the import tables of every shipped exe and dll.
          - label: windows-x64
            os: windows-latest
            rustflags: -C target-feature=+crt-static
          # Built on the oldest hosted Ubuntu so the glibc floor stays low; the
          # smoke job below runs the archive on a newer image.
          - label: linux-x64
            os: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A public release ships the project LICENSE in its archive. Dry runs
      # (workflow_dispatch) are unaffected.
      - name: Tag release requires a LICENSE file
        if: github.ref_type == 'tag'
        run: |
          test -f LICENSE || { echo "::error::no LICENSE file at the repository root; restore LICENSE (it is shipped in the release archive) before a release is tagged"; exit 1; }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1

      # mic-capture (cpal) needs the ALSA headers; twitch-chat-ingress uses the
      # system OpenSSL on Linux. Windows needs nothing extra.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libssl-dev pkg-config

      # Prebuilt, checksum-verified tool binaries; versions are pinned and are
      # recorded in docs/supply-chain.adoc section 11.
      - name: Install cargo-deny and cargo-about
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.3

      # The crate's own build script downloads UNCHECKED binaries unless
      # SHERPA_ONNX_ARCHIVE_DIR is set (docs/supply-chain.adoc section 9). The
      # archive is fetched and SHA-256-verified by our script first.
      - name: Fetch the pinned sherpa-onnx library archive (SHA-256 verified)
        run: node scripts/fetch-sherpa-onnx.mjs lib "$RUNNER_TEMP/sherpa-onnx"

      # The release feature set, including the scoped licence exceptions.
      - name: Supply chain with the release features
        run: cargo deny --locked --features "$ADAPTER_FEATURES" check

      - name: Build the sidecars
        env:
          SHERPA_ONNX_ARCHIVE_DIR: ${{ runner.temp }}/sherpa-onnx
        run: >
          cargo build --release --locked -p aivtuber-adapters
          --features "$ADAPTER_FEATURES"
          --bin speech-vad-sidecar --bin speech-stt-worker
          --bin local-tts-sidecar --bin twitch-chat-ingress --bin youtube-chat-ingress

      # aivtuber-setup is the first-run command (issue #294 S2): it fetches the
      # models and writes the configuration, so the archive needs no Node/Bun/Cargo.
      - name: Build the app, operator tool and first-run command
        run: >
          cargo build --release --locked
          -p aivtuber-app --bin aivtuber-app --bin aivtuberctl
          -p aivtuber-setup --bin aivtuber-setup

      # Exact pins, committed lock, no install hooks (docs/supply-chain.adoc section 8).
      - name: Build the avatar page
        working-directory: renderer/local-avatar
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run check:licenses
          bun run build

      - name: Generate the Rust third-party licence file
        run: >
          cargo about generate --locked --workspace
          --features "$ADAPTER_FEATURES"
          -c packaging/about.toml
          -o "$RUNNER_TEMP/third-party-rust.html"
          packaging/about.hbs

      - name: Assemble the archive
        run: |
          node scripts/package-release.mjs \
            --version "$RELEASE_VERSION" \
            --out "$RUNNER_TEMP/out" \
            --sherpa-archive-dir "$RUNNER_TEMP/sherpa-onnx" \
            --rust-notices "$RUNNER_TEMP/third-party-rust.html" \

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archive-${{ matrix.label }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 14

  # The smoke test runs in its own job on a different image from the build, and
  # touches nothing but the downloaded archive (and the smoke script): it shows
  # that the unpacked archive is self-contained, that every program starts, and
  # that the bundled engine libraries load and verify from beside the
  # executables. aivtuber-setup is exercised offline (--dry-run, --offline).
  # No model is fetched or run.
  smoke:
    name: Smoke ${{ matrix.label }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
          - label: linux-x64
            os: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            scripts/smoke-release-archive.mjs
            scripts/pe-imports.mjs
            scripts/release-notices.mjs
            packaging/third-party/
            packaging/local-profile-pins.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: archive-${{ matrix.label }}
          path: ${{ runner.temp }}/archive

      - name: Smoke the unpacked archive
        run: node scripts/smoke-release-archive.mjs "$RUNNER_TEMP"/archive/aivtuber-local-*

  checksums:
    name: SHA256SUMS
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: archive-*
          path: ${{ runner.temp }}/archives
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: ${{ runner.temp }}/archives
        run: |
          ls -l
          sha256sum aivtuber-local-* > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: ${{ runner.temp }}/archives/*
          if-no-files-found: error
          retention-days: 14

  # Tags only. A tag that is not on main is refused: a release is built from
  # reviewed, merged sources. The release is created as a DRAFT so a person
  # reads the notes and the checksums before it becomes public.
  publish:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: checksums
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Tag must be reachable from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: ${{ runner.temp }}/release

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Prebuilt local profile for Windows x64 and Linux x64. No model weights, voice files or avatar model are included: the first-run command `aivtuber-setup local` fetches and verifies them (no Node, Bun or Cargo needed).

          Verify the download against `SHA256SUMS` before you unpack it:

          - Windows (PowerShell): `Get-FileHash .\aivtuber-local-<version>-windows-x64.zip -Algorithm SHA256`
          - Linux: `sha256sum -c SHA256SUMS --ignore-missing`

          The programs are not code-signed. Windows SmartScreen may warn on first start.

          Then, from the unpacked folder: `aivtuber-setup local`, then `aivtuber-setup start`.

          Guide: docs/local-profile-quickstart.adoc ("Download a release").
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP"/release/*
