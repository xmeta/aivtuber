name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace

  schema:
    name: Performance Asset schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validator
        run: python -m pip install --disable-pip-version-check check-jsonschema==0.38.0

      - name: Accept valid examples
        run: check-jsonschema --schemafile schemas/performance-asset.schema.json examples/performance-assets/valid/*.json

      - name: Reject invalid examples
        shell: bash
        run: |
          if check-jsonschema --schemafile schemas/performance-asset.schema.json examples/performance-assets/invalid/*.json; then
            echo "Invalid fixture unexpectedly passed schema validation."
            exit 1
          fi
