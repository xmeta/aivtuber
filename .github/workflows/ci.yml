name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate schemas and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run validate
