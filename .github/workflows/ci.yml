name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      # Policy lives in deny.toml (licenses, advisories, bans, sources).
      # Advisory exception procedure: docs/supply-chain.adoc.
      # --locked ensures the gate never mutates Cargo.lock.
      - name: cargo deny check
        run: cargo deny --locked check

      # fuzz/ is excluded from the workspace, so it has its own fuzz/Cargo.lock
      # and the command above never resolves it. Without this step CI would
      # compile libfuzzer-sys and its transitive graph in every job while that
      # separate lock file stayed outside the supply-chain gate. Same policy,
      # both lock files.
      - name: cargo deny check (fuzz lock)
        run: cargo deny --manifest-path fuzz/Cargo.toml --locked check

  validate:
    name: Validate schemas and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository line endings
        shell: bash
        run: |
          bad="$(git ls-files --eol | awk '$1 == "i/crlf" { print }')"
          if [[ -n "$bad" ]]; then
            echo "Tracked files contain CRLF in the Git index; repository text must be normalized to LF."
            printf '%s\n' "$bad"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - run: bun install --frozen-lockfile
      - run: bun run validate:toolchains
      - run: bun run validate
      - run: bun run validate:rust-parity
      - run: bun test

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      # `fuzz/` is excluded from the workspace (issue #146), so `cargo fmt --all`
      # and `cargo clippy --workspace` never see it. These two commands would
      # otherwise pass on unformatted or unlinted fuzz targets, because the
      # exclusion that keeps libfuzzer-sys out of the workspace lock file also
      # removes it from these gates. Stable is sufficient: the crate needs
      # nightly only to *run* a campaign, not to format or lint.
      - name: Format fuzz crate
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check

      # --locked keeps CI from silently rewriting the reviewed fuzz/Cargo.lock.
      - name: Clippy fuzz crate
        run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Build
        run: cargo build --locked --workspace

      - name: Replay benchmark smoke
        run: cargo run --locked -p aivtuber-app --bin replay-benchmark -- examples/benchmarks/replay-comparison.json target/ci-benchmark

      - name: Failure/soak hardening smoke
        run: cargo run --locked -p aivtuber-hardening --bin failure-soak -- target/ci-hardening-soak.json 5000

      # Issue #58 Phase D: verifies the resource benchmark still emits a
      # schema-valid result and its hard bounded-state invariants stay clean.
      - name: Resource benchmark smoke
        run: cargo run --locked -p aivtuber-hardening --bin resource-bench -- target/ci-resource-bench 5000

      # Issue #147: the same seeded property subset the `regressions` job runs,
      # but here it is a step inside a REQUIRED status check. The standalone job
      # is not in main's branch protection, so on its own a regression failure
      # would leave the three required contexts green and the PR would still be
      # mergeable. Running it here makes the failure actually block the merge,
      # without needing a branch-protection change.
      #
      # Both steps carry the same pinned environment; scripts/validate.mjs
      # asserts the values appear in this job so the two copies cannot drift.
      - name: Bounded property regression subset (gating)
        run: cargo test --locked -p aivtuber-scheduler --test properties
        env:
          PROPTEST_CASES: "64"
          PROPTEST_RNG_SEED: "20261004"
          PROPTEST_MAX_SHRINK_ITERS: "4096"

      # `if: always()` for the same reason as the standalone job: the artifact
      # matters most when the run above has just failed and persisted a new case.
      - name: Persist any newly discovered regression case (gating)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proptest-regressions-rust-checks
          path: crates/scheduler/proptest-regressions/
          if-no-files-found: ignore
          retention-days: 14

  regressions:
    name: Bounded property regressions
    # Issue #147. `cargo test --workspace` runs the proptest suite with
    # proptest's defaults, so every PR explores a *different* random space and
    # the same code path is never replayed twice. This job pins the RNG seed and
    # the case count, so the PR-time subset is the same on every run and any
    # failure is reproducible from the command below.
    #
    # Deliberately stable-only and free of fuzz tooling (#146): libFuzzer needs
    # nightly, which would mean a second channel in
    # scripts/validate-toolchain-pins.mjs and an unpinned cargo-fuzz install in
    # the PR path. Bounded fuzz campaigns live in .github/workflows/fuzz.yml,
    # which is schedule/workflow_dispatch only and never blocks a PR.
    #
    # This job is NOT in main's required status checks, so a failure here does
    # not block a merge on its own. It exists to run the bounded subset and
    # publish any new shrunk case; the step that actually gates merges is the
    # identical seeded run inside the required `Rust checks` job, which shares
    # this checkout and therefore this proptest-regressions/ directory.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      # PROPTEST_RNG_SEED fixes the generated space; PROPTEST_CASES bounds it.
      # Both values are asserted by scripts/validate.mjs so they cannot drift
      # away from the documented command in docs/property-testing.adoc.
      #
      # Any persisted proptest-regressions/ case replays regardless of the seed,
      # so checked-in regressions still run here even though exploration is
      # fixed.
      - name: Bounded property regression subset
        run: cargo test --locked -p aivtuber-scheduler --test properties
        env:
          PROPTEST_CASES: "64"
          PROPTEST_RNG_SEED: "20261004"
          PROPTEST_MAX_SHRINK_ITERS: "4096"

      - name: Persist any newly discovered regression case
        # proptest resolves persistence relative to the *crate root*, not the
        # test file, so the file lands at crates/scheduler/proptest-regressions/.
        #
        # `if: always()` is required. Without it the default `success()` condition
        # skips this step whenever the step above exits non-zero -- which is
        # exactly the case where proptest has just shrunk and persisted a NEW
        # failing case. The artifact would then be lost with the runner, which is
        # the opposite of what this step exists for.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proptest-regressions
          path: crates/scheduler/proptest-regressions/
          if-no-files-found: ignore
          retention-days: 14

  schema:
    name: Schema and security fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validator
        run: python -m pip install --disable-pip-version-check check-jsonschema==0.38.0

      - name: Validate Performance Assets
        run: |
          check-jsonschema --schemafile schemas/performance-asset.schema.json \
            examples/performance-assets/valid/*.json \
            examples/starter-reaction-pack/descriptors/*.json

      - name: Reject invalid Performance Assets
        shell: bash
        run: |
          if check-jsonschema --schemafile schemas/performance-asset.schema.json examples/performance-assets/invalid/*.json; then
            echo "Invalid Performance Asset fixture unexpectedly passed."
            exit 1
          fi

      - name: Validate Event Envelopes
        run: |
          check-jsonschema --schemafile schemas/event-envelope.schema.json \
            examples/events/*.json

      - name: Reject forged Event Envelopes
        shell: bash
        run: |
          if check-jsonschema --schemafile schemas/event-envelope.schema.json examples/events/invalid/*.json; then
            echo "Forged Event Envelope unexpectedly passed."
            exit 1
          fi

      - name: Validate Reflex Decisions
        run: check-jsonschema --schemafile schemas/reflex-decision.schema.json examples/reflex-decisions/*.json

      - name: Reject invalid Reflex Decisions
        shell: bash
        run: |
          if check-jsonschema --schemafile schemas/reflex-decision.schema.json examples/reflex-decisions/invalid/*.json; then
            echo "Invalid Reflex Decision fixture unexpectedly passed."
            exit 1
          fi

      - name: Validate security regression fixtures
        run: check-jsonschema --schemafile schemas/security-regression-case.schema.json examples/security/*.json

      - name: Validate benchmark results
        run: check-jsonschema --schemafile schemas/benchmark-result.schema.json examples/benchmarks/result/valid/*.json

      - name: Reject invalid benchmark results
        shell: bash
        run: |
          if check-jsonschema --schemafile schemas/benchmark-result.schema.json examples/benchmarks/result/invalid/*.json; then
            echo "Invalid benchmark result fixture unexpectedly passed."
            exit 1
          fi
