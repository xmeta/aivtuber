name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      # Policy lives in deny.toml (licenses, advisories, bans, sources).
      # Advisory exception procedure: docs/supply-chain.adoc.
      # --locked ensures the gate never mutates Cargo.lock.
      - name: cargo deny check
        run: cargo deny --locked check

      # fuzz/ is excluded from the workspace, so it has its own fuzz/Cargo.lock
      # and the command above never resolves it. Without this step CI would
      # compile libfuzzer-sys and its transitive graph in every job while that
      # separate lock file stayed outside the supply-chain gate. Same policy,
      # both lock files.
      - name: cargo deny check (fuzz lock)
        run: cargo deny --manifest-path fuzz/Cargo.toml --locked check

  validate:
    name: Validate schemas and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository line endings
        shell: bash
        run: |
          bad="$(git ls-files --eol | awk '$1 == "i/crlf" { print }')"
          if [[ -n "$bad" ]]; then
            echo "Tracked files contain CRLF in the Git index; repository text must be normalized to LF."
            printf '%s\n' "$bad"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - run: bun install --frozen-lockfile
      - run: bun run validate:toolchains
      - run: bun run validate
      - run: bun run validate:rust-parity
      - run: bun test

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      # `fuzz/` is excluded from the workspace (issue #146), so `cargo fmt --all`
      # and `cargo clippy --workspace` never see it. These two commands would
      # otherwise pass on unformatted or unlinted fuzz targets, because the
      # exclusion that keeps libfuzzer-sys out of the workspace lock file also
      # removes it from these gates. Stable is sufficient: the crate needs
      # nightly only to *run* a campaign, not to format or lint.
      - name: Format fuzz crate
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check

      # --locked keeps CI from silently rewriting the reviewed fuzz/Cargo.lock.
      - name: Clippy fuzz crate
        run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      # Issue #92 S2: the Silero VAD v6 sidecar (tract inference) sits behind the
      # silero-vad feature so the default build does not compile an inference
      # runtime. No microphone is used (the mic-capture feature needs ALSA headers
      # and is exercised locally). The tests fetch the pinned model and verify its
      # SHA-256; the model is never committed.
      - name: Clippy speech sidecar
        run: cargo clippy --locked -p aivtuber-adapters --features silero-vad --all-targets -- -D warnings

      - name: Test speech sidecar
        run: cargo test --locked -p aivtuber-adapters --features silero-vad --test speech_vad_sidecar

      # Issue #83 S3d: the gapless phrase queue on rodio's offline mixer. The
      # gapless-queue feature does not enable rodio's `playback` (cpal), so it
      # needs no ALSA headers and no audio device; native-audio-spike (the
      # device) is not built here.
      - name: Clippy gapless queue
        run: cargo clippy --locked -p aivtuber-adapters --features gapless-queue --all-targets -- -D warnings

      - name: Test gapless queue (sample-exact falsifier)
        run: cargo test --locked -p aivtuber-adapters --features gapless-queue --test gapless_queue

      - name: Build
        run: cargo build --locked --workspace

      - name: Replay benchmark smoke
        run: cargo run --locked -p aivtuber-app --bin replay-benchmark -- examples/benchmarks/replay-comparison.json target/ci-benchmark

      - name: Failure/soak hardening smoke
        run: cargo run --locked -p aivtuber-hardening --bin failure-soak -- target/ci-hardening-soak.json 5000

      # Issue #58 Phase D: verifies the resource benchmark still emits a
      # schema-valid result and its hard bounded-state invariants stay clean.
      - name: Resource benchmark smoke
        run: cargo run --locked -p aivtuber-hardening --bin resource-bench -- target/ci-resource-bench 5000

      # Issue #147: the same seeded property subset the `regressions` job runs,
      # but here it is a step inside a REQUIRED status check. The standalone job
      # is not in main's branch protection, so on its own a regression failure
      # would leave the three required contexts green and the PR would still be
      # mergeable. Running it here makes the failure actually block the merge,
      # without needing a branch-protection change.
      #
      # Both steps carry the same pinned environment; scripts/validate.mjs
      # asserts the values appear in this job so the two copies cannot drift.
      - name: Bounded property regression subset (gating)
        run: cargo test --locked -p aivtuber-scheduler --test properties
        env:
          PROPTEST_CASES: "64"
          PROPTEST_RNG_SEED: "20261004"
          PROPTEST_MAX_SHRINK_ITERS: "4096"

      # `if: always()` for the same reason as the standalone job: the artifact
      # matters most when the run above has just failed and persisted a new case.
      - name: Persist any newly discovered regression case (gating)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proptest-regressions-rust-checks
          path: crates/scheduler/proptest-regressions/
          if-no-files-found: ignore
          retention-days: 14

  # Issue #92 S3b: the optional local Japanese STT worker (the `sherpa-stt`
  # feature, the official sherpa-onnx crate). It is a separate job, not part of
  # the required `Rust checks`, because it needs the engine libraries. It builds
  # and lints the feature and runs the model-free tests; it runs no model (no
  # weights are fetched or cached in CI, and none are ever committed).
  #
  # The crate's build script downloads prebuilt binaries over HTTPS and
  # verifies nothing unless SHERPA_ONNX_ARCHIVE_DIR is set, so the archive is
  # fetched and SHA-256-verified by our own script first and the variable is
  # set for every cargo step below. The default workspace gates never enable
  # the feature and never download anything.
  speech-stt:
    name: Speech STT worker (sherpa-stt feature, no model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Fetch the pinned sherpa-onnx library archive (SHA-256 verified)
        run: node scripts/fetch-sherpa-onnx.mjs lib "$RUNNER_TEMP/sherpa-onnx"

      - name: Supply chain with the feature (scoped license exceptions)
        run: cargo deny --locked --features sherpa-stt check

      - name: Clippy with the feature
        run: cargo clippy --locked -p aivtuber-adapters --features sherpa-stt --all-targets -- -D warnings
        env:
          SHERPA_ONNX_ARCHIVE_DIR: ${{ runner.temp }}/sherpa-onnx

      - name: Build the worker
        run: cargo build --locked -p aivtuber-adapters --features sherpa-stt --bin speech-stt-worker
        env:
          SHERPA_ONNX_ARCHIVE_DIR: ${{ runner.temp }}/sherpa-onnx

      - name: Model-free tests with the feature
        run: cargo test --locked -p aivtuber-adapters --features sherpa-stt --lib speech_stt
        env:
          SHERPA_ONNX_ARCHIVE_DIR: ${{ runner.temp }}/sherpa-onnx

      # The engine libraries are loaded from the worker's own directory (rpath
      # $ORIGIN, DT_RPATH so LD_LIBRARY_PATH cannot override it; crates/adapters/
      # build.rs), and the worker verifies the SHA-256 of exactly those files.
      # Place the libraries from the verified archive beside the binary, then
      # show the refusals. No weights here and no model is ever run.
      - name: Worker refuses an unpinned model and tampered libraries
        shell: bash
        run: |
          set -u
          work="$RUNNER_TEMP/worker-check"
          mkdir -p "$work/x" "$work/good"
          tar -xjf "$RUNNER_TEMP"/sherpa-onnx/*.tar.bz2 -C "$work/x"
          cp "$work"/x/*/lib/libsherpa-onnx-c-api.so "$work"/x/*/lib/libonnxruntime.so "$work/good/"
          cp target/debug/speech-stt-worker "$work/good/"
          mkdir -p "$work/no-model"
          run() { "$@" < /dev/null 2>"$work/stderr" ; echo $?; }

          # (a) genuine libraries beside the binary, empty model directory:
          # the library check passes and the model check refuses (exit 2).
          status=$(run "$work/good/speech-stt-worker" --model k2v2-int8 --model-dir "$work/no-model" --language ja)
          cat "$work/stderr"
          test "$status" -eq 2
          grep -q "model files" "$work/stderr"

          # (b) a library beside the binary is tampered with (one byte
          # appended): the loader still loads it, the worker refuses (exit 2).
          mkdir -p "$work/tampered"
          cp "$work"/good/* "$work/tampered/"
          printf '\0' >> "$work/tampered/libonnxruntime.so"
          status=$(run "$work/tampered/speech-stt-worker" --model k2v2-int8 --model-dir "$work/no-model" --language ja)
          cat "$work/stderr"
          test "$status" -eq 2
          grep -q "engine libraries beside the executable" "$work/stderr"

          # (c) LD_LIBRARY_PATH cannot substitute the libraries: the tampered
          # set on the library path is ignored and the genuine ones beside the
          # binary load, so the run reaches the model check, not the library one.
          status=$(LD_LIBRARY_PATH="$work/tampered" run "$work/good/speech-stt-worker" --model k2v2-int8 --model-dir "$work/no-model" --language ja)
          test "$status" -eq 2
          grep -q "model files" "$work/stderr"

          # (d) a missing library cannot be shown as a worker refusal: the
          # loader refuses first, before main (non-zero, not our exit 2).
          mkdir -p "$work/missing"
          cp "$work/good/speech-stt-worker" "$work/good/libsherpa-onnx-c-api.so" "$work/missing/"
          status=$(run "$work/missing/speech-stt-worker" --model k2v2-int8 --model-dir "$work/no-model" --language ja)
          cat "$work/stderr"
          test "$status" -ne 0 && test "$status" -ne 2

  # Issue #220 S2b: the optional local Japanese TTS sidecar (the `sherpa-tts`
  # feature: the same official sherpa-onnx crate and the same library pin as
  # `sherpa-stt`, so no new crate path). A sibling of `speech-stt`, not part of
  # the required `Rust checks`, for the same reason: it needs the engine
  # libraries. It builds and lints the feature, runs the model-free tests
  # (HTTP contract with a fake synthesizer, bounds, busy rejection, the
  # supervisor against a test double) and checks that the sidecar refuses an
  # unpinned model directory and tampered libraries. It runs no model: no
  # weights are fetched or cached in CI, and none are ever committed.
  #
  # As for STT, the crate's build script downloads unchecked binaries unless
  # SHERPA_ONNX_ARCHIVE_DIR is set, so the archive is fetched and
  # SHA-256-verified by our own script first and the variable is set for every
  # cargo step below. The default workspace gates never enable the feature.
  speech-tts:
    name: Local TTS sidecar (sherpa-tts feature, no model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Fetch the pinned sherpa-onnx library archive (SHA-256 verified)
        run: node scripts/fetch-sherpa-onnx.mjs lib "$RUNNER_TEMP/sherpa-onnx"

      - name: Supply chain with the feature (scoped license exceptions)
        run: cargo deny --locked --features sherpa-tts check

      - name: Clippy with the feature
        run: cargo clippy --locked -p aivtuber-adapters --features sherpa-tts --all-targets -- -D warnings
        env:
          SHERPA_ONNX_ARCHIVE_DIR: ${{ runner.temp }}/sherpa-onnx

      - name: Build the sidecar
        run: cargo build --locked -p aivtuber-adapters --features sherpa-tts --bin local-tts-sidecar
        env:
          SHERPA_ONNX_ARCHIVE_DIR: ${{ runner.temp }}/sherpa-onnx

      - name: Model-free tests with the feature
        run: |
          cargo test --locked -p aivtuber-adapters --features sherpa-tts --lib speech_tts
          cargo test --locked -p aivtuber-adapters --features sherpa-tts --test tts_sidecar_supervisor
        env:
          SHERPA_ONNX_ARCHIVE_DIR: ${{ runner.temp }}/sherpa-onnx

      # Same loader rule as the STT worker (crates/adapters/build.rs): the
      # libraries are loaded from the sidecar's own directory and the sidecar
      # verifies the SHA-256 of exactly those files. Place the libraries from
      # the verified archive beside the binary, then show the refusals. No
      # weights here and no model is ever run.
      - name: Sidecar refuses an unpinned model and tampered libraries
        shell: bash
        run: |
          set -u
          work="$RUNNER_TEMP/tts-check"
          mkdir -p "$work/x" "$work/good" "$work/no-model" "$work/audio"
          tar -xjf "$RUNNER_TEMP"/sherpa-onnx/*.tar.bz2 -C "$work/x"
          cp "$work"/x/*/lib/libsherpa-onnx-c-api.so "$work"/x/*/lib/libonnxruntime.so "$work/good/"
          cp target/debug/local-tts-sidecar "$work/good/"
          run() { "$@" < /dev/null 2>"$work/stderr" ; echo $?; }
          args=(--model-dir "$work/no-model" --audio-root "$work/audio" --listen 127.0.0.1:0)

          # (a) genuine libraries beside the binary, an empty model directory:
          # the library check passes and the model check refuses (exit 2).
          status=$(run "$work/good/local-tts-sidecar" "${args[@]}")
          cat "$work/stderr"
          test "$status" -eq 2
          grep -q "model files" "$work/stderr"

          # (b) a library beside the binary is tampered with (one byte
          # appended): the loader still loads it, the sidecar refuses (exit 2).
          mkdir -p "$work/tampered"
          cp "$work"/good/* "$work/tampered/"
          printf '\0' >> "$work/tampered/libonnxruntime.so"
          status=$(run "$work/tampered/local-tts-sidecar" "${args[@]}")
          cat "$work/stderr"
          test "$status" -eq 2
          grep -q "engine libraries beside the executable" "$work/stderr"

          # (c) a non-loopback listen address is refused before anything loads.
          status=$(run "$work/good/local-tts-sidecar" --model-dir "$work/no-model" --audio-root "$work/audio" --listen 0.0.0.0:0)
          cat "$work/stderr"
          test "$status" -eq 2
          grep -q "not loopback" "$work/stderr"

  regressions:
    name: Bounded property regressions
    # Issue #147. `cargo test --workspace` runs the proptest suite with
    # proptest's defaults, so every PR explores a *different* random space and
    # the same code path is never replayed twice. This job pins the RNG seed and
    # the case count, so the PR-time subset is the same on every run and any
    # failure is reproducible from the command below.
    #
    # Deliberately stable-only and free of fuzz tooling (#146): libFuzzer needs
    # nightly, which would mean a second channel in
    # scripts/validate-toolchain-pins.mjs and an unpinned cargo-fuzz install in
    # the PR path. Bounded fuzz campaigns live in .github/workflows/fuzz.yml,
    # which is schedule/workflow_dispatch only and never blocks a PR.
    #
    # This job is NOT in main's required status checks, so a failure here does
    # not block a merge on its own. It exists to run the bounded subset and
    # publish any new shrunk case; the step that actually gates merges is the
    # identical seeded run inside the required `Rust checks` job, which shares
    # this checkout and therefore this proptest-regressions/ directory.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      # PROPTEST_RNG_SEED fixes the generated space; PROPTEST_CASES bounds it.
      # Both values are asserted by scripts/validate.mjs so they cannot drift
      # away from the documented command in docs/property-testing.adoc.
      #
      # Any persisted proptest-regressions/ case replays regardless of the seed,
      # so checked-in regressions still run here even though exploration is
      # fixed.
      - name: Bounded property regression subset
        run: cargo test --locked -p aivtuber-scheduler --test properties
        env:
          PROPTEST_CASES: "64"
          PROPTEST_RNG_SEED: "20261004"
          PROPTEST_MAX_SHRINK_ITERS: "4096"

      - name: Persist any newly discovered regression case
        # proptest resolves persistence relative to the *crate root*, not the
        # test file, so the file lands at crates/scheduler/proptest-regressions/.
        #
        # `if: always()` is required. Without it the default `success()` condition
        # skips this step whenever the step above exits non-zero -- which is
        # exactly the case where proptest has just shrunk and persisted a NEW
        # failing case. The artifact would then be lost with the runner, which is
        # the opposite of what this step exists for.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proptest-regressions
          path: crates/scheduler/proptest-regressions/
          if-no-files-found: ignore
          retention-days: 14

  schema:
    name: Schema and security fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validator
        run: python -m pip install --disable-pip-version-check check-jsonschema==0.38.0

      - name: Validate Performance Assets
        run: |
          check-jsonschema --schemafile schemas/performance-asset.schema.json \
            examples/performance-assets/valid/*.json \
            examples/starter-reaction-pack/descriptors/*.json

      - name: Reject invalid Performance Assets
        shell: bash
        run: |
          if check-jsonschema --schemafile schemas/performance-asset.schema.json examples/performance-assets/invalid/*.json; then
            echo "Invalid Performance Asset fixture unexpectedly passed."
            exit 1
          fi

      - name: Validate Event Envelopes
        run: |
          check-jsonschema --schemafile schemas/event-envelope.schema.json \
            examples/events/*.json

      - name: Reject forged Event Envelopes
        shell: bash
        run: |
          if check-jsonschema --schemafile schemas/event-envelope.schema.json examples/events/invalid/*.json; then
            echo "Forged Event Envelope unexpectedly passed."
            exit 1
          fi

      - name: Validate Reflex Decisions
        run: check-jsonschema --schemafile schemas/reflex-decision.schema.json examples/reflex-decisions/*.json

      - name: Reject invalid Reflex Decisions
        shell: bash
        run: |
          if check-jsonschema --schemafile schemas/reflex-decision.schema.json examples/reflex-decisions/invalid/*.json; then
            echo "Invalid Reflex Decision fixture unexpectedly passed."
            exit 1
          fi

      - name: Validate security regression fixtures
        run: check-jsonschema --schemafile schemas/security-regression-case.schema.json examples/security/*.json

      - name: Validate benchmark results
        run: check-jsonschema --schemafile schemas/benchmark-result.schema.json examples/benchmarks/result/valid/*.json

      - name: Reject invalid benchmark results
        shell: bash
        run: |
          if check-jsonschema --schemafile schemas/benchmark-result.schema.json examples/benchmarks/result/invalid/*.json; then
            echo "Invalid benchmark result fixture unexpectedly passed."
            exit 1
          fi

  # Issue #219 S3 / ADR-0003: the local VRM renderer is a separate npm project
  # (renderer/local-avatar, its own package.json + bun.lock). cargo-deny does
  # not see it, so this job is its supply-chain gate (docs/supply-chain.adoc
  # section 8) and also runs the GPU-less end-to-end smoke: the real Rust
  # LocalAvatarOutput serves the built bundle and a pinned sample model to
  # headless Chromium under SwiftShader.
  #
  # Not in main's required status checks (it downloads a browser and a model);
  # a failure is visible on the PR and is meant to be treated as blocking for
  # renderer changes.
  renderer:
    name: Local avatar renderer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: renderer/local-avatar
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Vite and Playwright run on Node, not Bun.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      # Exact pins + committed lock; --ignore-scripts so no dependency can run
      # an install hook.
      - name: Install renderer dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build bundle
        run: bun run build

      # MIT/BSD/Apache/ISC allowlist over the installed tree.
      - name: License allowlist
        run: bun run check:licenses

      # Advisory audit of the locked tree. Exceptions: docs/supply-chain.adoc
      # section 8 (none active).
      - name: Advisory audit
        run: bun audit

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('renderer/local-avatar/bun.lock') }}

      - name: Install Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      # The sample model is fetched pinned to an upstream commit and verified
      # by SHA-256 (smoke/fetch-model.mjs); never committed.
      - name: Cache sample model
        uses: actions/cache@v4
        with:
          path: renderer/local-avatar/smoke/.cache
          key: vrm-sample-12c2b97e95e700783a6a550dc0eee2d7880aeedccef9ae67bc4c5a2f0f2631a2

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: renderer-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Build smoke host (real LocalAvatarOutput)
        working-directory: .
        run: cargo build --locked -p aivtuber-app --example local_avatar_smoke

      - name: Headless smoke (SwiftShader, no GPU)
        run: node smoke/smoke.mjs --bin ../../target/debug/examples/local_avatar_smoke

      # Screenshots are evidence when the smoke fails; they contain only the
      # sample model.
      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-avatar-smoke
          path: renderer/local-avatar/smoke/out/
          if-no-files-found: ignore
          retention-days: 7
