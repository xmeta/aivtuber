name: Benchmark gate

# Issue #58 Phase C: same-runner base-vs-head replay comparison.
# The job checks out base and head revisions, benchmarks both under the
# identical fixture/seed/config boundaries, and gates with benchmark-compare.
#
# Security boundary (issue #58): pull_request jobs from untrusted forked code
# must not receive write credentials. This job only reads the repository and
# uploads artifacts — `permissions: contents: read` is sufficient. Gate
# history/trust updates (Phase E) are handled on main, never here.

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "examples/benchmarks/**"
      - "benchmarks/**"
      - ".github/workflows/benchmark-gate.yml"
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "examples/benchmarks/**"
      - "benchmarks/**"
      - ".github/workflows/benchmark-gate.yml"

permissions:
  contents: read

jobs:
  base-vs-head:
    name: Replay base vs head
    # PR-only: the job resolves the base via the pulls API
    # (github.event.pull_request.number), which push payloads do not carry.
    # Push-to-main is handled by record-main below.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Resolve base SHA
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq .base.sha)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "base SHA: ${sha}"

      # Head checkout: pin the exact PR head SHA. The pull_request default
      # (refs/pull/<n>/merge) is a synthetic merge commit, not the reviewed
      # revision — #58 Phase C requires exact base vs exact head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Issue #180: one benchmark run is not a measurement of a metric whose
      # values are single-digit microseconds — its run-to-run spread is wider
      # than the whole failure budget, so a gate on one run fails on noise.
      # Both revisions are therefore built into their own binary and run
      # REPEATS times, interleaved (A/B/A/B) so runner drift does not land
      # entirely on one side of the comparison.
      - name: Build head benchmark binary
        run: |
          cargo build --locked -p aivtuber-app --bin replay-benchmark
          mkdir -p results/bin
          cp target/debug/replay-benchmark results/bin/replay-benchmark-head

      # Base checkout second so post-steps and artifacts describe the PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.sha }}
          clean: false

      - name: Build base benchmark binary
        run: |
          cargo build --locked -p aivtuber-app --bin replay-benchmark
          cp target/debug/replay-benchmark results/bin/replay-benchmark-base

      # Return to the exact PR head revision before measuring: the comparator,
      # the budgets it loads (benchmarks/budgets.json), the fixture, and the
      # comparator binary must all be exactly what the PR reviewed — a
      # `git checkout -- .` after the base build would only re-expand the base
      # index and silently gate with base-side semantics. Both sides then run
      # the *same* reviewed fixture and asset pack, so a PR that edits them
      # compares like-for-like instead of hitting the dataset_id mismatch
      # guard; the measured unit is "this code against the reviewed
      # configuration", not "each revision against its own assets".
      # Results survive in results/ (checkout leaves untracked files alone).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: false

      # Provenance, revision-agnostic: give each side its own clean worktree at the
      # revision it was built from and run its binary with that worktree as
      # the working directory. `git rev-parse HEAD` then resolves to the
      # revision under test even for a base revision that predates this
      # workflow, and nothing is written inside the worktrees so they stay
      # clean (issue #180 review). Results and binaries are addressed by
      # absolute path because the process runs elsewhere.
      - name: Prepare per-revision worktrees
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/bench-head" "$HEAD_SHA"
          git worktree add --detach "$RUNNER_TEMP/bench-base" "$BASE_SHA"
          for side in head base; do
            echo "bench-${side} HEAD: $(git -C "$RUNNER_TEMP/bench-${side}" rev-parse HEAD)"
          done

      - name: Benchmark base and head, interleaved
        env:
          REPEATS: "7"
        run: |
          mkdir -p results/head results/base
          for run in $(seq 1 "$REPEATS"); do
            for side in head base; do
              out="$GITHUB_WORKSPACE/target/bench-${side}-${run}"
              rm -rf "$out"
              (
                cd "$RUNNER_TEMP/bench-${side}"
                "$GITHUB_WORKSPACE/results/bin/replay-benchmark-${side}" \
                  "$GITHUB_WORKSPACE/examples/benchmarks/replay-comparison.json" \
                  "$out"
              )
              # Prefix each result with its run index so the comparator sees
              # one distinct file per run per side.
              for result in "$out"/*-result.json; do
                cp "$result" "results/${side}/${run}-$(basename "$result")"
              done
            done
          done

      # Deterministic comparator: same inputs always yield the same verdict.
      # Hard invariants gate strictly; noisy timing metrics are warning-only
      # until calibrated (benchmarks/budgets.json, issue #58). Repeated runs
      # per side are aggregated by median (metrics) / maximum (invariants),
      # issue #180. Only the deterministic mode is gated (its result carries
      # the budgets in benchmarks/budgets.json); the other modes are uploaded
      # as artifacts but never compared against each other.
      - name: Compare base vs head
        id: gate
        run: |
          set +e
          args=()
          for result in results/base/*-01-deterministic-result.json; do
            args+=(--base "$result")
          done
          for result in results/head/*-01-deterministic-result.json; do
            args+=(--head "$result")
          done
          cargo run --locked -p aivtuber-app --bin benchmark-compare -- \
            "${args[@]}" \
            benchmarks/budgets.json \
            results/gate
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      # Provenance assertion: the aggregated report must carry the two
      # revisions the job actually resolved, not whatever HEAD happened to
      # be when the binaries ran (issue #180 review).
      - name: Assert measured revisions match the resolved SHAs
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          if [ ! -f results/gate/gate-report.json ]; then
            echo "no gate report to verify (the comparator did not run)"
            exit 0
          fi
          report_base="$(python3 -c 'import json;print(json.load(open("results/gate/gate-report.json"))["base_commit"])')"
          report_head="$(python3 -c 'import json;print(json.load(open("results/gate/gate-report.json"))["head_commit"])')"
          echo "reported base=$report_base head=$report_head"
          echo "expected base=$BASE_SHA head=$HEAD_SHA"
          if [ "$report_base" != "$BASE_SHA" ] || [ "$report_head" != "$HEAD_SHA" ]; then
            echo "Benchmark provenance mismatch: results do not carry the revisions under test."
            exit 1
          fi

      - name: Publish job summary
        if: always()
        run: |
          if [ -f results/gate/gate-summary.md ]; then
            cat results/gate/gate-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmark gate did not produce a summary (see logs)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-gate-results
          path: |
            results/base/
            results/head/
            results/gate/
          retention-days: 30

      # Enforce the gate verdict after summary/artifact publication so
      # reviewers always get the table even on failure.
      - name: Enforce gate verdict
        if: always()
        run: |
          status="${{ steps.gate.outputs.status }}"
          echo "comparator exit: ${status}"
          exit "${status}"

  # Issue #58 Phase E: persist trusted main-branch replay results to the
  # benchmark-data branch for trend analysis. This job runs only on push to
  # main, so it executes repository-owned code and may hold write access;
  # the pull_request job above keeps contents: read only.
  record-main:
    name: Record main benchmark history
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: benchmark-data-append
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Benchmark main
        run: |
          cargo run --locked -p aivtuber-app --bin replay-benchmark -- \
            examples/benchmarks/replay-comparison.json target/bench-main
          mkdir -p results/main
          cp target/bench-main/*-result.json results/main/

      - name: Record to benchmark history
        if: success()
        run: |
          # run_id is invariant across re-runs (only run_attempt increments),
          # so identity keys on it alone and a re-run stays idempotent.
          bun scripts/benchmark-record.mjs \
            --suite replay-comparison \
            --run-id "run-${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --files results/main/01-deterministic-result.json \
                    results/main/02-semantic-result.json \
                    results/main/03-semantic-jev-result.json \
                    results/main/04-full-generative-result.json

      - name: Push benchmark history
        if: success()
        run: git push origin benchmark-data

      # Issue #71: the SLO baseline selector needs a *persisted* history, not
      # reports that only ever existed on a laptop. Record the target-free SLO
      # measurement of the same revision under the same re-run-invariant run
      # identity the benchmark history uses, so a re-run replaces its rows
      # while distinct runs accumulate into a calibratable series.
      - name: Record SLO calibration history
        if: success()
        run: |
          mkdir -p results/slo
          # `slo-report` reads the mode reports (`<slug>.json`), not the
          # `BenchmarkResult` aggregates (`<slug>-result.json`) the benchmark
          # history stores: the aggregate keeps selected metrics but not the
          # per-event denominators the operational indicators are defined on.
          for report in target/bench-main/*.json; do
            case "$report" in
              *-result.json|*comparison-suite.json) continue ;;
            esac
            stem="$(basename "$report" .json)"
            cargo run --locked -p aivtuber-app --bin slo-report -- \
              --report "$report" \
              --run-id "run-${{ github.run_id }}" \
              --out "results/slo/${stem}.json"
          done
          bun scripts/slo-record.mjs --files results/slo/*.json

      - name: Push SLO calibration history
        if: success()
        run: git push origin slo-data
